upstream backend { server platform:80; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ye paths backend (Platform) ko jaate hain
    location ~ ^/(api|ucp|cms-content|externalsignin|signin-oidc|signin-google)(/|$) { proxy_pass http://backend; }
    location ~ ^/connect/(authorize|session|token) { proxy_pass http://backend; }
    location ^~ /revoke/token { proxy_pass http://backend; }
    location ~ ^/\.well-known/ { proxy_pass http://backend; }
    location ~ ^/modules/.+/plugins/vc-frontend/ { proxy_pass http://backend; }

    # GraphQL: yahan proxy_set_header likhe hain, isliye server-level headers
    # inherit nahi hote. Host aur baaki headers yahan dobara likhna zaroori hai.
    location /graphql {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Baaki sab: website (SPA)
    location / { try_files $uri $uri/ /index.html; }
}
